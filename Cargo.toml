[workspace]
resolver = "3"
members = [
    "crates/cherry-pit-core",
    "crates/cherry-pit-gateway",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/acje/cherry-pit"
authors = ["Anders Jensen <anders.jensen@users.noreply.github.com>"]

[workspace.dependencies]
# === Internal crates ===
cherry-pit-core = { path = "crates/cherry-pit-core" }
cherry-pit-gateway = { path = "crates/cherry-pit-gateway" }

# === Async runtime ===
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# === Time ===
jiff = { version = "0.2", features = ["serde"] }

# === Identity ===
uuid = { version = "1", features = ["v7", "serde"] }

# === Stream utilities ===
futures-util = "0.3"

# === Concurrency ===
scc = "3"

# === Dev dependencies ===
proptest = "1"
tempfile = "3"
trybuild = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
overflow-checks = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
