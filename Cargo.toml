[workspace]
resolver = "3"
members = [
    "crates/cherry-pit-app",
    "crates/cherry-pit-core",
    "crates/cherry-pit-gateway",
    "crates/cherry-pit-merger",
    "crates/cherry-pit-projection",
    "crates/cherry-pit-wq",
    "crates/cherry-pit-storage",
    "crates/cherry-pit-web",
    "crates/non-exhaustive-check",
    "crates/pardosa-cherry-pit-projection",
    "crates/pardosa-cherry-pit-test-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/acje/cherry-pit"
repository = "https://github.com/acje/cherry-pit"
authors = ["Mattilsynet"]

[workspace.dependencies]
proc-macro2 = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
toml = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
scc = "3"
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "ws"] }
tower-http = { version = "0.7", features = ["limit", "trace"] }
bytes = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "gzip"] }
sha2 = "0.11"
zstd = { version = "0.14", default-features = false }
arc-swap = { version = "1", default-features = false }
tracing = "0.1"
thiserror = "2"
criterion = { version = "0.8", default-features = false }
fastrand = "2"
gethostname = "1"
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }
cherry-pit-core = { path = "crates/cherry-pit-core", version = "0.1.0" }
cherry-pit-gateway = { path = "crates/cherry-pit-gateway", version = "0.1.0" }
cherry-pit-projection = { path = "crates/cherry-pit-projection", version = "0.1.0" }
cherry-pit-web = { path = "crates/cherry-pit-web", version = "0.1.0" }
cherry-pit-app = { path = "crates/cherry-pit-app", version = "0.1.0" }
cherry-pit-merger = { path = "crates/cherry-pit-merger", version = "0.1.0" }
pardosa = { git = "https://github.com/acje/pardosa", rev = "52f9692fd3281edb4060383fe541f84210209cef", version = "0.5.5" }
tokio-util = { version = "0.7", default-features = false }
tempfile = "3"
proptest = "1"
trybuild = "1"
tokio-tungstenite = "0.30"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
lto = true
strip = true
codegen-units = 1
overflow-checks = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_underscore = "warn"
as_pointer_underscore = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "warn"
fallible_impl_from = "warn"
fn_to_numeric_cast_any = "warn"
inefficient_to_string = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_ascii_check = "warn"
manual_let_else = "warn"
manual_pattern_char_comparison = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_wild_err_arm = "warn"
mixed_read_write_in_expression = "warn"
mut_mut = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_else = "warn"
rest_pat_in_fully_bound_structs = "warn"
search_is_some = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
todo = "warn"
trailing_empty_array = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
wildcard_enum_match_arm = "warn"
zero_sized_map_values = "warn"
