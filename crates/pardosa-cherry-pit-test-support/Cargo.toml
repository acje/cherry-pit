[package]
name = "pardosa-cherry-pit-test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/acje/cherry-pit/tree/main/crates/pardosa-cherry-pit-test-support"
publish = false
description = "Test-only pgno-backed cherry_pit_core::EventStore adapter (bridge crate per CHE-0084:R4-R6; outside the cherry-pit-* DAG, dev-dependency only for cherry-pit-* test targets)."

[lints]
workspace = true

[lib]
name = "pardosa_cherry_pit_test_support"
path = "src/lib.rs"

[dependencies]
cherry-pit-core = { workspace = true }
pardosa = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pardosa = { workspace = true, features = ["unstable-test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
